name: Build 焦易林
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: 'esp32:esp32:esp32s3:PSRAM=enabled,CDCOnBoot=cdc,FlashMode=qio,FlashSize=16M'
          platforms: |
            - source-url: 'https://espressif.github.io/arduino-esp32/package_esp32_index.json'
              name: 'esp32:esp32'
          libraries: |
            - name: 'GFX Library for Arduino'
          sketch-paths: |
            - .
          enable-deltas-report: false
      - name: Find firmware
        run: find /home/runner -name "esp32*.bin" -type f 2>/dev/null | head -10
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: /home/runner/**/esp32*.bin
