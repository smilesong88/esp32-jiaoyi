name: Build 焦易林

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: 'esp32:esp32:esp32s3:PSRAM=enabled,CDCOnBoot=cdc,FlashMode=qio,FlashSize=16M'
          platforms: |
            - source-url: 'https://espressif.github.io/arduino-esp32/package_esp32_index.json'
              name: 'esp32:esp32'
          cli-version: 'latest'
          libraries: |
            - name: 'GFX Library for Arduino'
          sketch-paths: 'esp32-jiaoyi.ino'
          enable-deltas-report: false
      - name: Find firmware
        run: find . -name "*.bin" -type f
     - name: List all generated files
        run: |
          echo "=== workspace files ==="
          find . -type f | head -50
          echo ""
          echo "=== search .bin files ==="
          find / -name "esp32-jiaoyi*" -type f 2>/dev/null | head -20
          find /tmp -name "*.bin" -type f 2>/dev/null | head -10
          find /home/runner -name "*.bin" -type f 2>/dev/null | head -10
